version: '3'

vars:
    PLUGIN_DIR: deckfaqs
    OUT: out
    ZIP: deckfaqs.zip

tasks:
    install:
        desc: Install dependencies
        cmds:
            - pnpm install

    build:
        desc: Bundle src/index.tsx into dist/index.js
        cmds:
            - pnpm run build
        sources:
            - src/**/*
            - package.json
            - tsconfig.json
            - rollup.config.js
            - plugin.json
        generates:
            - dist/index.js

    typecheck:
        desc: Type-check without emitting
        cmds:
            - npx tsc --noEmit

    format:
        desc: Format sources with prettier
        cmds:
            - npx prettier --write src

    package:
        desc: Build and zip the plugin (same layout as CI) into deckfaqs.zip / deckfaqs.tar.gz
        deps: [build]
        cmds:
            - ./scripts/package.sh
            - 'echo "Unzip {{.ZIP}} into /home/deck/homebrew/plugins/ on the Deck, then: sudo systemctl restart plugin_loader"'

    clean:
        desc: Remove build outputs
        cmds:
            - rm -rf dist {{.OUT}} {{.ZIP}} deckfaqs.tar.gz
