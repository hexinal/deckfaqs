# npm: one grouped, low-noise version-update PR per month for minor/patch
# bumps (majors come as individual PRs) plus Dependabot security PRs, all with
# Conventional-Commit prefixes so they pass commitlint. Runtime-dep bumps
# release a patch (fix), dev deps don't. `cooldown` mirrors
# `pnpm.minimumReleaseAge` (3 days) as a supply-chain guard.
# github-actions: version updates ON — the workflows pin actions to commit SHAs,
# and this is what keeps those pins moving.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 3
      cooldown:
          default-days: 3
      groups:
          npm-minor-patch:
              patterns: ['*']
              update-types: [minor, patch]
      ignore:
          # v10 produces empty release notes with @semantic-release/release-notes-generator (see #4).
          - dependency-name: conventional-changelog-conventionalcommits
            versions: ['>=10']
          # TS 7 (native) has no JS compiler API for @rollup/plugin-typescript.
          - dependency-name: typescript
            versions: ['>=7']
      commit-message:
          prefix: 'fix(deps)'
          prefix-development: 'chore(deps)'
      labels: [dependencies]

    # uv: the Python dev tools in uv.lock (ruff, ty, pytest) — nothing ships
    # to the Deck, so plain chores.
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 2
      cooldown:
          default-days: 3
      groups:
          python-tools:
              patterns: ['*']
      commit-message:
          prefix: 'chore(deps)'
      labels: [dependencies]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'ci(deps)'
      labels: [dependencies, security]
