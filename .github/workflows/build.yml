name: Build and Release DeckFAQs

on:
    push:
        branches: ['main']
    # Any PR (also stacked PRs targeting a feature branch); the release job
    # is gated on main below.
    pull_request:

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Least privilege by default; the release job widens this.
permissions:
    contents: read

jobs:
    # Commit messages drive semantic-release (fix -> patch, feat -> minor, ...),
    # so enforce Conventional Commits on every commit in a PR / push.
    commitlint:
        name: Lint commits
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup

            - name: Lint commit messages
              uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

    # Squash merges use the PR title as the commit message, so lint it too.
    pr-title:
        name: Lint PR title
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Flags newly introduced vulnerable/unlicensed dependencies in a PR
    # (complements Dependabot security PRs and the audit step below).
    dependency-review:
        name: Dependency review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: build-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup

            - name: Audit runtime dependencies
              run: pnpm audit --prod --audit-level=high

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Type-check
              run: pnpm run typecheck

            - name: Unit tests
              run: pnpm run test

            - name: Unused code / dependencies
              run: pnpm run knip

            - name: Build
              run: pnpm run build

            # Runs the built dist/index.js in jsdom with fake Steam/Decky globals
            # and drives games -> search -> guides -> guide against saved GameFAQs
            # pages, so a dependency bump that breaks the plugin at runtime fails here.
            - name: Smoke test built bundle
              run: pnpm run test:smoke

            # Produces deckfaqs.zip / deckfaqs.tar.gz in the Decky plugin layout
            # (package.json with "type": "module" next to plugin.json, bundle in dist/).
            - name: Package
              run: pnpm run package

            - name: Upload package
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: deckfaqs
                  path: |
                      deckfaqs.zip
                      deckfaqs.tar.gz

    release:
        name: Release
        needs: [build, commitlint]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency: release
        permissions:
            contents: write # tags, release commit, GitHub release + assets
            id-token: write # sigstore signing for the build provenance attestation
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/setup

            # Mint a short-lived token for the deckfaqs-release-bot GitHub App.
            # The app is a bypass actor on the `main` ruleset, so it can push the
            # release commit + tag (GITHUB_TOKEN cannot bypass rulesets).
            - name: Create release token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  # Only what semantic-release needs: release commit, tag, GitHub release.
                  permission-contents: write

            # semantic-release: analyses conventional commits since the last tag,
            # bumps package.json, writes CHANGELOG.md, rebuilds + packages with the
            # new version (see .releaserc.json), commits back, tags and publishes
            # a GitHub release with the zip/tarball attached.
            - name: Release
              run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            # The archives only exist when semantic-release actually cut a
            # release (its prepare step runs scripts/package.sh). Attest them so
            # `gh attestation verify deckfaqs.zip -R hexinal/deckfaqs` proves the
            # asset was built by this workflow from this commit (SLSA provenance).
            - name: Attest build provenance
              if: hashFiles('deckfaqs.zip') != ''
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: |
                      deckfaqs.zip
                      deckfaqs.tar.gz
