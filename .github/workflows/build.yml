name: Build and Release DeckFAQs

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: npx tsc --noEmit

            - name: Build
              run: pnpm run build

            # Produces deckfaqs.zip / deckfaqs.tar.gz in the Decky plugin layout
            # (package.json with "type": "module" next to plugin.json, bundle in dist/).
            - name: Package
              run: ./scripts/package.sh

            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                  name: deckfaqs
                  path: |
                      deckfaqs.zip
                      deckfaqs.tar.gz

    release:
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        concurrency: release
        permissions:
            contents: write # tags, release commit, GitHub release + assets
            issues: write # comment on released issues
            pull-requests: write # comment on released PRs
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            # semantic-release: analyses conventional commits since the last tag,
            # bumps package.json, writes CHANGELOG.md, rebuilds + packages with the
            # new version (see .releaserc.json), commits back, tags and publishes
            # a GitHub release with the zip/tarball attached.
            - name: Release
              run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
