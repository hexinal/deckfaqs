name: Build and Release DeckFAQs

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Least privilege by default; the release job widens this.
permissions:
    contents: read

jobs:
    # Commit messages drive semantic-release (fix -> patch, feat -> minor, ...),
    # so enforce Conventional Commits on every commit in a PR / push.
    commitlint:
        name: Lint commits
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup

            - name: Lint commit messages
              uses: wagoid/commitlint-github-action@v6

    # Squash merges use the PR title as the commit message, so lint it too.
    pr-title:
        name: Lint PR title
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: build-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - name: Check formatting
              run: pnpm run format:check

            - name: Type-check
              run: pnpm run typecheck

            - name: Build
              run: pnpm run build

            # Produces deckfaqs.zip / deckfaqs.tar.gz in the Decky plugin layout
            # (package.json with "type": "module" next to plugin.json, bundle in dist/).
            - name: Package
              run: pnpm run package

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: deckfaqs
                  path: |
                      deckfaqs.zip
                      deckfaqs.tar.gz

    release:
        name: Release
        needs: [build, commitlint]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency: release
        permissions:
            contents: write # tags, release commit, GitHub release + assets
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/setup

            # Mint a short-lived token for the deckfaqs-release-bot GitHub App.
            # The app is a bypass actor on the `main` ruleset, so it can push the
            # release commit + tag (GITHUB_TOKEN cannot bypass rulesets).
            - name: Create release token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            # semantic-release: analyses conventional commits since the last tag,
            # bumps package.json, writes CHANGELOG.md, rebuilds + packages with the
            # new version (see .releaserc.json), commits back, tags and publishes
            # a GitHub release with the zip/tarball attached.
            - name: Release
              run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
