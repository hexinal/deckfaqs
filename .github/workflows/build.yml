name: Build and Release DeckFAQs

on:
    push:
        tags:
            - 'v*'
    pull_request:
        branches: ['main']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: build
              run: pnpm run build

            # Decky Loader needs package.json ("type": "module") next to plugin.json
            # to load the ESM bundle from dist/index.js.
            - name: copy files into build
              run: |
                  cp plugin.json package.json LICENSE ./dist/
                  mkdir ./dist/dist
                  mv ./dist/index.js ./dist/index.js.map ./dist/dist/

            - name: Upload package
              uses: actions/upload-artifact@v4
              with:
                  name: deckfaqs
                  path: |
                      ./dist/*
    release:
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: deckfaqs
                  path: deckfaqs

            - name: zip/tar release
              run: |
                  zip -r deckfaqs.zip deckfaqs/*
                  tar -czvf deckfaqs.tar.gz deckfaqs

            - name: Create a release
              uses: ncipollo/release-action@v1
              with:
                  artifacts: 'deckfaqs.zip,deckfaqs.tar.gz'
                  bodyFile: 'release.md'
                  token: ${{ secrets.GITHUB_TOKEN }}
